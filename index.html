<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home - Google Classroom</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <script>
    (function() {
      if (window.self !== window.top) {
        window.location.replace('/public/');
        return;
      }
      try {
        var win = window.open('about:blank', '_blank');
        if (win && !win.closed && typeof win.closed !== 'undefined') {
          var targetUrl = window.location.origin + '/public/';
          var doc = win.document;
          doc.open();
          doc.write('<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Home - Google Classroom</title><link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png"><style>*{margin:0;padding:0;box-sizing:border-box;}html,body{width:100%;height:100%;overflow:hidden;background:#0b0d14;}iframe{width:100%;height:100%;border:none;outline:none;display:block;}</style></head><body><iframe src="' + targetUrl + '" allow="fullscreen; autoplay; gamepad; cross-origin-isolated; camera; microphone; clipboard-read; clipboard-write; display-capture"></iframe></body></html>');
          doc.close();
          window.location.replace('https://classroom.google.com');
          return;
        }
      } catch (err) {}
      window.location.replace('/public/');
    })();
  </script>
</head>
<body>
  <p>Loading session...</p>
</body>
</html>
